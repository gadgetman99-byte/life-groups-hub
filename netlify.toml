[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "bcryptjs"]

# Route API calls to functions
[[redirects]]
  from = "/api/tenants/*"
  to = "/.netlify/functions/tenants/:splat"
  status = 200

[[redirects]]
  from = "/api/events/*"
  to = "/.netlify/functions/events/:splat"
  status = 200

[[redirects]]
  from = "/api/ideas/*"
  to = "/.netlify/functions/ideas/:splat"
  status = 200

[[redirects]]
  from = "/api/messages/*"
  to = "/.netlify/functions/messages/:splat"
  status = 200

[[redirects]]
  from = "/api/comms/*"
  to = "/.netlify/functions/comms/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
